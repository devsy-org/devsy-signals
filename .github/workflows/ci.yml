name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.23.x
      - name: Test Go floor
        run: go test -race ./... && go vet ./...
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x
      - name: Test current Go
        run: go test -race ./...
      - name: Test tools module
        run: cd tools && go test -race ./...
      - name: Check published error codes are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cd tools && go run ./cmd/checkpublished -base "$BASE_SHA"
      - name: Check generated files are current
        run: |
          cd tools && go run ./cmd/gencodes && go run ./cmd/genauditschema
          go run ./cmd/gendepthschema
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          working-directory: tools
      - name: Check Go formatting
        run: golangci-lint fmt --diff && (cd tools && golangci-lint fmt --diff)

  # Left out of ci-success needs until it has run for a week without false positives.
  mask-scan:
    name: Mask Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: devsy-org/ci/mask-scan@1225bd8960ff7eac8e7d6eafbb55073551c853c7

  ci-success:
    name: CI Success
    if: always()
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: test "${{ needs.go.result }}" = "success"
